name: Build and publish docs

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/opencollection-docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install occdocs
        run: pip install -e ".[site]"

      - name: Generate docs + mkdocs.yml from collections/
        run: occ-docs build --site-name "ASL API Documentation"

      - name: Build static site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/opencollection-docs/site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
