info:
  name: create organization with minimal data
  type: http
  seq: 7

http:
  method: POST
  url: "{{url}}/organization/quick-create"
  body:
    type: json
    data: |-
      {
          "short_code": "AWA",
          "email": "eservation@airastra.com",
          "name": "Air Astra"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

