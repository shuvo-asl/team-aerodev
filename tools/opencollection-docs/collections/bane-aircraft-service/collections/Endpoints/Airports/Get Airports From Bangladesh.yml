info:
  name: Get Airports From Bangladesh
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/airports?bangladeshi=false"
  params:
    - name: bangladeshi
      value: "false"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
