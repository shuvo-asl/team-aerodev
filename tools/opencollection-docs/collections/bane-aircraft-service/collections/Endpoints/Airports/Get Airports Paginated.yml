info:
  name: Get Airports Paginated
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/airports?page=5&limit=10"
  params:
    - name: page
      value: "5"
      type: query
    - name: limit
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
