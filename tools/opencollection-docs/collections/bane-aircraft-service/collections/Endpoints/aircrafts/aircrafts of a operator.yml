info:
  name: aircrafts of a operator
  type: http
  seq: 10

http:
  method: GET
  url: "{{url}}/aircraft/operator?all=true&short_code=ETH"
  params:
    - name: operator_id
      value: "14709"
      type: query
      disabled: true
    - name: all
      value: "true"
      type: query
    - name: short_code
      value: ETH
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

