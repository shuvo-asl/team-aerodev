info:
  name: Clear cache
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/api/cache/clear/"
  body:
    type: json
    data: |-
      {
          "type":"all"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
