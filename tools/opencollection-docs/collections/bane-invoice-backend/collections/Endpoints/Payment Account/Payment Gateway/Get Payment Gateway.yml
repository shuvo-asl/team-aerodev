info:
  name: Get Payment Gateway
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/api/payment-gateway/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

