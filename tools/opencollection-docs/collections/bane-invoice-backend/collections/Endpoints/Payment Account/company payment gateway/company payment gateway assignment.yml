info:
  name: company payment gateway assignment
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/api/company-payment-gateway/"
  body:
    type: json
    data: |-
      {
          "payment_gateway_model": 1
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

