info:
  name: sample/example data for coa/client
  type: http
  seq: 3

http:
  method: GET
  url: "{{url}}/api/export-import/?file_type=csv&model=coa&sample=true"
  params:
    - name: file_type
      value: csv
      type: query
    - name: model
      value: coa
      type: query
    - name: sample
      value: "true"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
