info:
  name: get single api token
  type: http
  seq: 4

http:
  method: GET
  url: "{{url}}/api/api-token/1"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: New Request
    request:
      url: "{{url}}/api/api-token/1"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Thu, 30 Jan 2025 05:33:12 GMT
        - name: Server
          value: WSGIServer/0.2 CPython/3.8.20
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: GET, PUT, PATCH, DELETE, HEAD, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "205"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "API Token Fetched Successfully",
              "data": {
                  "result": {
                      "ip": "192.168.90.234",
                      "token": "7bPu586pU01xQrsL",
                      "is_active": false,
                      "expires_at": "2025-02-22T11:27:02.303619+06:00",
                      "id": 1
                  }
              }
          }
