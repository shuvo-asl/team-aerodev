info:
  name: generate third party jwt token pairs
  type: http
  seq: 5

http:
  method: POST
  url: "{{url}}/api/third-party/token/"
  body:
    type: json
    data: |-
      {
          "token": "123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

