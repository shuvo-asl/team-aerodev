info:
  name: get all api token
  type: http
  seq: 3

http:
  method: GET
  url: "{{url}}/api/api-token/?limit=2&page=1"
  params:
    - name: limit
      value: "2"
      type: query
    - name: page
      value: "1"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: New Request
    request:
      url: "{{url}}/api/api-token/?limit=2&page=1"
