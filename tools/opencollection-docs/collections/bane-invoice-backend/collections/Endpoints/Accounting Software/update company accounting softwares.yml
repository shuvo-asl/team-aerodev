info:
  name: update company accounting softwares
  type: http
  seq: 11

http:
  method: PATCH
  url: "{{url}}/api/company-accounting-software/1/"
  body:
    type: json
    data: |-
      {
          "is_active": true
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

