info:
  name: Xero Force Disconnect
  type: http
  seq: 3

http:
  method: POST
  url: "{{url}}/api/xero/disconnect/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
          "accounting_software": "8",
          "force_disconnect": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
