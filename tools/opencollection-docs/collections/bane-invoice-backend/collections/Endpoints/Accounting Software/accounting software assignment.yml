info:
  name: accounting software assignment
  type: http
  seq: 13

http:
  method: POST
  url: "{{url}}/api/assign-accounting-software/"
  body:
    type: json
    data: |-
      {
          "accounting_software_id": 1,
          "name": "xero"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
