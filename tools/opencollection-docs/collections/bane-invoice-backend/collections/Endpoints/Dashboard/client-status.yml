info:
  name: client-status
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/api/client-status/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: client-status
    request:
      url: "{{url}}/api/client-status/"
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{token}}
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Tue, 12 Nov 2024 07:10:14 GMT
        - name: Server
          value: WSGIServer/0.2 CPython/3.7.17
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: GET, HEAD, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "107"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Client Status",
              "data": {
                  "result": {
                      "active_clients": 36,
                      "inactive_clients": 4
                  }
              }
          }
