info:
  name: void candidates
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/api/candidates/void/"
  body:
    type: json
    data: |-
      {
        "candidate_ids": [16, 17],
        "resolution_note": "This flight are not billed"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: void multiple candidates
    request:
      url: "{{url}}/api/candidates/void/"
      method: POST
      body:
        type: json
        data: |-
          {
            "candidate_ids": [16, 17],
            "resolution_note": "This flight are not billed"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.27.5
        - name: date
          value: Tue, 08 Sep 2026 04:14:51 GMT
        - name: content-type
          value: application/json
        - name: content-length
          value: "92"
        - name: connection
          value: keep-alive
        - name: vary
          value: Accept, origin
        - name: allow
          value: POST, OPTIONS
        - name: x-frame-options
          value: DENY, SAMEORIGIN
        - name: x-content-type-options
          value: nosniff, nosniff
        - name: referrer-policy
          value: same-origin, no-referrer-when-downgrade
        - name: cross-origin-opener-policy
          value: same-origin
        - name: x-xss-protection
          value: 1; mode=block
      body:
        type: json
        data: |-
          {
            "status": "success",
            "message": "2 candidate(s) voided.",
            "data": {
              "result": {
                "voided_count": 2
              }
            }
          }
