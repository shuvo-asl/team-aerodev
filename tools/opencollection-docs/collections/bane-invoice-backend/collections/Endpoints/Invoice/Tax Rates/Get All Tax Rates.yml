  type: http
  seq: 3

http:
  method: GET
  url: "{{url}}/api/tax-rates/?search=tax"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: ""
      value: ""
      disabled: true
  params:
    - name: is_active
      value: "true"
      type: query
      disabled: true
    - name: default
      value: "true"
      type: query
      disabled: true
    - name: source
      value: Xero
      type: query
      disabled: true
    - name: limit
      value: "10"
      type: query
      disabled: true
    - name: search
      value: tax
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

