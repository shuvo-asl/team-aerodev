info:
  name: create tax rate mapping
  type: http
  seq: 8

http:
  method: POST
  url: "{{url}}/api/tax-rate-mapping/2/"
  body:
    type: json
    data: |-
      [
          {
              "from_tax_rate": 1,
              "to_tax_rate": 21
          },
          {
              "from_tax_rate": 2,
              "to_tax_rate": 223
          }
      ]
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
