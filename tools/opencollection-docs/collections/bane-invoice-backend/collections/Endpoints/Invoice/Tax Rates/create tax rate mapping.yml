    request:
      url: "{{url}}/api/tax-rate-mapping/2/"
      method: POST
      body:
        type: json
        data: |-
          [
              {
                  "from_tax_rate": 1,
                  "to_tax_rate": 21
              },
              {
                  "from_tax_rate": 2,
                  "to_tax_rate": 22
              }
          ]
