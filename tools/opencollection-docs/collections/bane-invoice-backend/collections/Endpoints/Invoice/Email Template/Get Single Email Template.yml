info:
  name: Get Single Email Template
  type: http
  seq: 3

http:
  method: GET
  url: "{{url}}/api/email_template/1/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Get All Email Template
    request:
      url: "{{url}}/api/email_template/"
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{token}}
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, origin
        - name: Allow
          value: GET, POST, HEAD, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "141"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
        - name: Cross-Origin-Opener-Policy
          value: same-origin
        - name: Server
          value: daphne
      body:
        type: json
        data: |-
          {
              "success": true,
              "data": [
                  {
                      "id": 1,
                      "name": "test",
                      "subject": "demo",
                      "text": "text",
                      "attach_copy_invoice": false,
                      "attach_customer_statement": false
                  }
              ]
          }
