docs: |-
  **Description:**

  Renders an email template with dynamic data such as invoice details, dates, and operator name.

  ---

  ### **Request Parameters**

  **Path Parameter:**

  - `template_id` (integer): ID of the email template to render.
      

  **Request Body (JSON):**

  ``` json
  {
      "invoice_no": "inv 001",
      "operator_name": "name op",
      "due_date": "2025-06-12",
      "paid_amount": 0,
      "due_amount": 20,
      "issue_date": "2025-05-27"
  }
   ```
