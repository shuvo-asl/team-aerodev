info:
  name: dispute upload
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/api/flight-disputes/upload/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: multipart-form
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
