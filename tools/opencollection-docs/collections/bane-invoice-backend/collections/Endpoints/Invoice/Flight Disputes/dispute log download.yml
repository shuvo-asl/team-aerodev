info:
  name: dispute log download
  type: http
  seq: 5

http:
  method: GET
  url: "{{url}}/api/flight-disputes/{{dispute_log_id}}/download/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

runtime:
  variables:
    - name: dispute_log_id
      value: "2"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
