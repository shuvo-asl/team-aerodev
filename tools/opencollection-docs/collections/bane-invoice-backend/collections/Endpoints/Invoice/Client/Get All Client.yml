info:
  name: Get All Client
  type: http
  seq: 3

http:
  method: GET
  url: "{{url}}/api/client/?all=True"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  params:
    - name: all
      value: "True"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
