info:
  name: get additional email of client
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/api/clients-additional-email/?client=40"
  params:
    - name: client
      value: "40"
      type: query
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: limit
      value: "2"
      type: query
      disabled: true
  body:
    type: text
    data: |-
      {
          "client": 40, 
          "emails": ["client6@gmail.com"]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: get additional email of client
    request:
      url: "{{url}}/api/clients-additional-email/?client=40"
      method: GET
      params:
        - name: client
          value: "40"
          type: query
        - name: page
          value: "1"
          type: query
          disabled: true
        - name: limit
          value: "2"
          type: query
          disabled: true
      body:
        type: text
        data: |-
          {
              "client": 40, 
              "emails": ["client6@gmail.com"]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.27.5
        - name: Date
          value: Wed, 21 May 2025 05:22:14 GMT
