info:
  name: operator creation by third party
  type: http
  seq: 8

http:
  method: POST
  url: "{{url}}/api/third-party/create-operator/"
  body:
    type: json
    data: |-
      {
          "name": "postman_op",
          "short_code": "PMO2",
          "email": "postman_op2@gmail.com",
          "phone": "+8801558250667",
          "billing_address": "Dhaka",
          "days_to_due_date": 20
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

