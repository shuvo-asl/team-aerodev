info:
  name: generate invoice number
  type: http
  seq: 10

http:
  method: GET
  url: "{{url}}/api/generate-invoice-number/"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: generate invoice number
    request:
      url: "{{url}}/api/generate-invoice-number/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.27.5
        - name: Date
          value: Tue, 10 Feb 2026 10:50:31 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "146"
        - name: Connection
          value: keep-alive
        - name: vary
          value: Accept, origin
        - name: allow
          value: GET, HEAD, OPTIONS
        - name: x-frame-options
          value: DENY
        - name: x-content-type-options
          value: nosniff
        - name: referrer-policy
          value: same-origin
        - name: cross-origin-opener-policy
          value: same-origin
        - name: X-Frame-Options
          value: SAMEORIGIN
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-XSS-Protection
          value: 1; mode=block
        - name: Referrer-Policy
          value: no-referrer-when-downgrade
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Changes are being pushed to the accounting software",
              "data": {
                  "result": {
                      "invoice_number": "000033",
                      "prefix": "INV:"
                  }
              }
          }
