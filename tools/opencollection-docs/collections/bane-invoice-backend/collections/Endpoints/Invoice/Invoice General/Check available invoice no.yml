info:
  name: Check available invoice no
  type: http
  seq: 4

http:
  method: GET
  url: "{{url}}/api/invoice/check-invoice-no/?invoice_no=INV-000083"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  params:
    - name: invoice_no
      value: INV-000083
      type: query
    - name: invoice_id
      value: "84"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Check Available invoice no
    request:
      url: "{{url}}/api/invoice/check-invoice-no/?invoice_no=INV-000083"
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{token}}
      params:
        - name: invoice_no
          value: INV-000083
          type: query
        - name: invoice_id
          value: "84"
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.27.3
        - name: Date
          value: Thu, 26 Jun 2025 07:37:50 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "175"
        - name: Connection
          value: keep-alive
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: GET, HEAD, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Invoice number 'INV-000083' is already in use",
              "data": {
                  "result": {
                      "available": false,
                      "invoice_no": "INV-000083",
                      "existing_invoice_status": "sent"
                  }
              }
          }
  - name: Available while editing invoice
