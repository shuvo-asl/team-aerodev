info:
  name: Get All Invoice Interest Schedule
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/api/invoice-interest-schedule?limit=10&page=1"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  params:
    - name: limit
      value: "10"
      type: query
    - name: page
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
