info:
  name: interest rule list
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/api/interest-rule/"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: New Request
    request:
      url: "{{url}}/api/interest-rule/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Tue, 04 Mar 2025 08:34:12 GMT
        - name: Server
          value: WSGIServer/0.2 CPython/3.8.20
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: GET, POST, HEAD, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "88"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Interest Rule Successfully Fetched",
              "data": {
                  "result": []
              }
          }
