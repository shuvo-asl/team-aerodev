info:
  name: change default status
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{url}}/api/interest-rule/10/set_default/"
  body:
    type: json
    data: |-
      {
          "is_default": true
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

