info:
  name: create interest rule
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/api/interest-rule/"
  body:
    type: json
    data: |-
      {
          "name": "interest-d2",
          "is_cumulative": true,
          "interest_day": 22,
          "interest_type": "fixed",
          "interest_rate": 23,
          "max_repetition": 2,
          "is_default": true 
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: New Request
    request:
      url: "{{url}}/api/interest-rule/"
      method: POST
      body:
        type: json
        data: |-
          {
              "name": "interest1",
              "is_cumulative": true,
              "day": 23,
              "interest_type": "fixed",
              "interest_rate": 23,
              "max_repetition": 2
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Date
          value: Tue, 04 Mar 2025 08:42:32 GMT
        - name: Server
          value: WSGIServer/0.2 CPython/3.8.20
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: GET, POST, HEAD, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "238"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Interest Rule successfully created",
              "data": {
                  "result": {
                      "name": "interest1",
                      "is_default": false,
                      "is_cumulative": true,
                      "day": 23,
                      "max_repetition": 2,
                      "interest_type": "fixed",
                      "interest_rate": 23,
                      "interest_base": ""
                  }
              }
          }
