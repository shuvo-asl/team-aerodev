info:
  name: Create registration exception group
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/api/aircraft-registration-exception/"
  body:
    type: json
    data: |-
      {
          "note": "These aircrafts are VIP",
          "registrations": ["TEST01", "TEST02"]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

