info:
  name: get bank accounts by currency code
  type: http
  seq: 4

http:
  method: GET
  url: "{{url}}/api/account/?account_type=BANK&object_name=bank&currency_code=INR"
  params:
    - name: account_type
      value: BANK
      type: query
    - name: object_name
      value: bank
      type: query
    - name: currency_code
      value: INR
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

