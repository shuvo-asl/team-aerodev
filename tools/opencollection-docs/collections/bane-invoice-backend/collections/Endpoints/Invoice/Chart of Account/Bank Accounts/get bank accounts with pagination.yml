info:
  name: get bank accounts with pagination
  type: http
  seq: 5

http:
  method: GET
  url: "{{url}}/api/account/?account_type=BANK&object_name=bank&page=1&limit=2"
  params:
    - name: account_type
      value: BANK
      type: query
    - name: object_name
      value: bank
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "2"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: get bank accounts Copy
