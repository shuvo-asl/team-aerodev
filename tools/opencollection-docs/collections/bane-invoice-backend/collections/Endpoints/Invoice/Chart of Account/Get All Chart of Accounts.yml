info:
  name: Get All Chart of Accounts
  type: http
  seq: 5

http:
  method: GET
  url: "{{url}}/api/account/?limit=10"
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: ""
      value: ""
      disabled: true
  params:
    - name: code
      value: abc
      type: query
      disabled: true
    - name: is_active
      value: "true"
      type: query
      disabled: true
    - name: limit
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

