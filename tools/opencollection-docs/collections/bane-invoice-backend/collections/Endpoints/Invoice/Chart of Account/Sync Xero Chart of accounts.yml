info:
  name: Sync Xero Chart of accounts
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{url}}/api/xero/sync-coa/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Sync Xero Chart of accounts
    request:
      url: "{{url}}/api/xero/sync-coa/"
      method: PATCH
      headers:
        - name: Authorization
          value: Bearer {{token}}
      body:
        type: multipart-form
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Tue, 08 Oct 2024 06:00:01 GMT
        - name: Server
          value: WSGIServer/0.2 CPython/3.7.17
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: PATCH, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "143"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Chart of Accounts Synced Successfully",
              "data": {
                  "result": {
                      "number_of_updated_coa": 53,
                      "number_of_created_coa": 0
                  }
              }
          }
