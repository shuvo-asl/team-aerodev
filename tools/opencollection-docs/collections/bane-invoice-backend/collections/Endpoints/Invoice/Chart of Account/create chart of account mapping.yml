info:
  name: create chart of account mapping
  type: http
  seq: 12

http:
  method: POST
  url: "{{url}}/api/coa-mapping/2/"
  body:
    type: json
    data: "[\r

      \    {\r

      \        \"from_account\": 1,\r

      \        \"to_account\": 1653\r

      \    },\r

      \    {\r

      \        \"from_account\": 1,\r

      \        \"to_account\": 16544\r

      \    }\r

      ]"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

