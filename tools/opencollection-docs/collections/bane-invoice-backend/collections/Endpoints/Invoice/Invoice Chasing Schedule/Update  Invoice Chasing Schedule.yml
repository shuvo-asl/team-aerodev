http:
  method: PATCH
  url: "{{url}}/api/invoice-chasing-schedule/5/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
          "invoice": 11,
          "chase_on": "after due date",
          "is_cumulative": true,
          "chasing_days": [3],
          "email_template": 1,
          "name": "sample name3",
          "max_repetition": 5
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

