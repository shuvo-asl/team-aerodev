info:
  name: create pdf templates
  type: http
  seq: 3

http:
  method: POST
  url: "{{url}}/api/pdf-template/"
  body:
    type: json
    data: |-
      {
          "design_id": 3,
          "has_bank_details": false,
          // "bank_details_id": 3,
          "has_chasing_details": true,
          "title": "Default PDF template for SSAAA Update",
          "terms_and_conditions": "abcd",
          "fields_of_interest": {
              "table_fields": ["serial", "name", "unit", "unit_price", "sub_total", "discount_rate", "tax_rate", "tax_amount", "total"],
              "summary_fields": ["amount", "tax_amount", "payable_amount"]
          },
          "is_default":true

      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

