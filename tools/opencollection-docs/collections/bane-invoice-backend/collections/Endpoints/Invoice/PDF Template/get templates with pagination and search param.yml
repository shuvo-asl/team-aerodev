info:
  name: get templates with pagination and search param
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/api/pdf-template/?page=1&limit=2&search=general"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "2"
      type: query
    - name: search
      value: general
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

