info:
  name: get periodic tasks
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/api/periodic-tasks/?invoice_id=18"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  params:
    - name: invoice_id
      value: "18"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
