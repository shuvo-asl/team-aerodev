info:
  name: Flight Transfer To Client
  type: http
  seq: 27

http:
  method: POST
  url: "{{url}}/api/flight-transfer-to-client/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "flights":[18881],
        "flight_status":"incomplete",
        "source_client_id":3,
        "destination_client_id":2872,
        "registrations":["N315SL"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "[400-FAILED]Only Transfer"
    description: Only flight transfer without transferring registrations or attach to any report
    request:
      url: "{{url}}/api/flight-transfer-to-client/"
      method: POST
      headers:
        - name: Authorization
          value: Bearer {{token}}
      body:
        type: json
        data: |-
          {
            "flights":[],
            "flight_status":"ready_to_bill",
            "source_client_id":123,
            "destination_client_id":456
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: |-
          {
            "status": "failed",
            "message": "Failed to transfer flight(s) to client",
            "error": null,
            "errors": {
              "flights": "Please select at least one flight."
            }
          }
  - name: "[Success] Only Transfer"
    description: Only flight(Ready To Bill) transfer from ETH to RWD. no attach/detach/registration transfer
    request:
      url: "{{url}}/api/flight-transfer-to-client/"
      method: POST
      headers:
        - name: Authorization
          value: Bearer {{token}}
      body:
        type: json
        data: |-
          {
            "flights":[19195],
            "flight_status":"ready_to_bill",
            "source_client_id":3,
            "destination_client_id":2872
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.27.5
        - name: date
          value: Thu, 13 Aug 2026 06:27:04 GMT
        - name: content-type
          value: application/json
        - name: content-length
          value: "85"
        - name: connection
          value: keep-alive
        - name: vary
          value: Accept, origin
        - name: allow
          value: POST, OPTIONS
        - name: x-frame-options
          value: DENY, SAMEORIGIN
        - name: x-content-type-options
          value: nosniff, nosniff
        - name: referrer-policy
          value: same-origin, no-referrer-when-downgrade
        - name: cross-origin-opener-policy
          value: same-origin
        - name: x-xss-protection
          value: 1; mode=block
      body:
        type: json
        data: |-
          {
            "status": "success",
            "message": "Flight successfully transferred",
            "data": {
              "result": {}
            }
          }
