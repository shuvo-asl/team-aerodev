info:
  name: attach muliple flights to invoice
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/api/attach-multiple-flights/"
  body:
    type: json
    data: |-
      {
        "report_id": 69,
        "flights": [12243]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: atleast one flight is required flight list for attach
    request:
      url: "{{url}}/api/attach-multiple-flights/"
      method: POST
      body:
        type: json
        data: |-
          {
            "report_id": 69,
            "flights": []
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: server
          value: nginx/1.27.5
        - name: date
          value: Thu, 16 Jul 2026 06:29:23 GMT
        - name: content-type
          value: application/json
        - name: content-length
          value: "137"
        - name: connection
          value: keep-alive
        - name: vary
          value: Accept, origin
        - name: allow
          value: POST, OPTIONS
        - name: x-frame-options
          value: DENY, SAMEORIGIN
        - name: x-content-type-options
          value: nosniff, nosniff
        - name: referrer-policy
          value: same-origin, no-referrer-when-downgrade
        - name: cross-origin-opener-policy
          value: same-origin
        - name: x-xss-protection
          value: 1; mode=block
      body:
        type: json
        data: |-
          {
            "status": "failed",
            "message": "Failed to attach flights to report",
            "error": null,
            "errors": {
              "flights": "Please select at least one flight."
            }
          }
  - name: can't attach a flight to voided invoice
    request:
      url: "{{url}}/api/attach-multiple-flights/"
      method: POST
      body:
        type: json
        data: |-
          {
            "report_id": 325,
            "flights": [1]
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: server
          value: nginx/1.27.5
        - name: date
          value: Thu, 16 Jul 2026 06:31:18 GMT
        - name: content-type
          value: application/json
        - name: content-length
          value: "132"
        - name: connection
          value: keep-alive
        - name: vary
          value: Accept, origin
        - name: allow
          value: POST, OPTIONS
        - name: x-frame-options
          value: DENY, SAMEORIGIN
        - name: x-content-type-options
          value: nosniff, nosniff
        - name: referrer-policy
          value: same-origin, no-referrer-when-downgrade
        - name: cross-origin-opener-policy
          value: same-origin
        - name: x-xss-protection
          value: 1; mode=block
      body:
        type: json
        data: |-
          {
            "status": "failed",
            "message": "Failed to attach flights to report",
            "error": "Cannot attach flights to a voided report.",
            "errors": null
          }
  - name: flights must be in ready to bill status for attach operation
    request:
      url: "{{url}}/api/attach-multiple-flights/"
      method: POST
      body:
        type: json
        data: |-
          {
            "report_id": 69,
            "flights": [37210]
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: server
          value: nginx/1.27.5
        - name: date
          value: Thu, 16 Jul 2026 06:32:27 GMT
        - name: content-type
          value: application/json
        - name: content-length
          value: "178"
        - name: connection
          value: keep-alive
        - name: vary
          value: Accept, origin
        - name: allow
          value: POST, OPTIONS
        - name: x-frame-options
          value: DENY, SAMEORIGIN
        - name: x-content-type-options
          value: nosniff, nosniff
        - name: referrer-policy
          value: same-origin, no-referrer-when-downgrade
        - name: cross-origin-opener-policy
          value: same-origin
        - name: x-xss-protection
          value: 1; mode=block
      body:
        type: json
        data: |-
          {
            "status": "failed",
            "message": "Failed to attach flights to report",
            "error": "Some of the selected flights are not in Ready to Bill status.",
            "errors": {
              "invalid_flight_ids": [
                37210
              ]
            }
          }
  - name: flight and invoice client must match
    request:
      url: "{{url}}/api/attach-multiple-flights/"
      method: POST
      body:
        type: json
        data: |-
          {
            "report_id": 69,
            "flights": [37170]
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: server
          value: nginx/1.27.5
        - name: date
          value: Thu, 16 Jul 2026 06:33:39 GMT
        - name: content-type
          value: application/json
        - name: content-length
          value: "193"
        - name: connection
          value: keep-alive
        - name: vary
          value: Accept, origin
        - name: allow
          value: POST, OPTIONS
        - name: x-frame-options
          value: DENY, SAMEORIGIN
        - name: x-content-type-options
          value: nosniff, nosniff
        - name: referrer-policy
          value: same-origin, no-referrer-when-downgrade
        - name: cross-origin-opener-policy
          value: same-origin
        - name: x-xss-protection
          value: 1; mode=block
      body:
        type: json
        data: |-
          {
            "status": "failed",
            "message": "Failed to attach flights to report",
            "error": "Some of the selected flights do not belong to the same client as the report.",
            "errors": {
              "invalid_flight_ids": [
                37170
              ]
            }
          }
  - name: successful attachment
    request:
      url: "{{url}}/api/attach-multiple-flights/"
      method: POST
      body:
        type: json
        data: |-
          {
            "report_id": 69,
            "flights": [12243]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.27.5
        - name: date
          value: Thu, 16 Jul 2026 06:36:17 GMT
        - name: content-type
          value: application/json
        - name: content-length
          value: "117"
        - name: connection
          value: keep-alive
        - name: vary
          value: Accept, origin
        - name: allow
          value: POST, OPTIONS
        - name: x-frame-options
          value: DENY, SAMEORIGIN
        - name: x-content-type-options
          value: nosniff, nosniff
        - name: referrer-policy
          value: same-origin, no-referrer-when-downgrade
        - name: cross-origin-opener-policy
          value: same-origin
        - name: x-xss-protection
          value: 1; mode=block
      body:
        type: json
        data: |-
          {
            "status": "success",
            "message": "Flights attached successfully.",
            "data": {
              "result": {
                "attached_count": 1,
                "report_id": 69
              }
            }
          }
