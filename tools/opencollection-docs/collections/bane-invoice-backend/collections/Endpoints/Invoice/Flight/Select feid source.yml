info:
  name: Select feid source
  type: http
  seq: 24

http:
  method: POST
  url: "{{url}}/api/flight/32702/field-source/select/"
  body:
    type: json
    data: |-
      {
        "selections": [{"field":  "aircraft_registration_no", "source":  "tfm"}]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
