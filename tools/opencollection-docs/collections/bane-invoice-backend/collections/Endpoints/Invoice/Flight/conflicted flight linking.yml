info:
  name: conflicted flight linking
  type: http
  seq: 30

http:
  method: POST
  url: "{{url}}/api/flight-conflict-link/"
  body:
    type: json
    data: |-
      {
        "created_from_id": 372,
        "created_from_type": "candidate_engine",
        "conflicting_flight": 58881
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: linked with conflicted flight
    request:
      url: "{{url}}/api/flight-conflict-link/"
      method: POST
      body:
        type: json
        data: |-
          {
            "created_from_id": 372,
            "created_from_type": "candidate_engine",
            "conflicting_flight": 58881
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.27.5
        - name: date
          value: Tue, 17 Nov 2026 08:40:09 GMT
        - name: content-type
          value: application/json
        - name: content-length
          value: "108"
        - name: connection
          value: keep-alive
        - name: vary
          value: Accept, origin
        - name: allow
          value: POST, OPTIONS
        - name: x-frame-options
          value: DENY, SAMEORIGIN
        - name: x-content-type-options
          value: nosniff, nosniff
        - name: referrer-policy
          value: same-origin, no-referrer-when-downgrade
        - name: cross-origin-opener-policy
          value: same-origin
        - name: x-xss-protection
          value: 1; mode=block
      body:
        type: json
        data: |-
          {
            "status": "success",
            "message": "Source linked to flight successfully.",
            "data": {
              "result": {
                "flight_id": 58881
              }
            }
          }
