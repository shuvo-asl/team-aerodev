info:
  name: unlock field source
  type: http
  seq: 25

http:
  method: POST
  url: "{{url}}/api/flight/32702/field-source/unlock/"
  body:
    type: json
    data: |-
      {
        "fields": ["aircraft_registration_no"]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
