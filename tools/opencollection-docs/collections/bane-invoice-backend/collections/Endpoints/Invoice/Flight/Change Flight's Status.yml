info:
  name: Change Flight's Status
  type: http
  seq: 10

http:
  method: POST
  url: "{{url}}/api/flight/change-status/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
          "flight_ids": [1],
          "new_status": "billed"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

