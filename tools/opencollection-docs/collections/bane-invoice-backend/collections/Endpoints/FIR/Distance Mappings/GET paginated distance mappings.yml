info:
  name: GET paginated distance mappings
  type: http
  seq: 3

http:
  method: GET
  url: "{{url}}/api/fir-distance-mappings/?page=1&limit=10"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
