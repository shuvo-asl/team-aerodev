info:
  name: GET distance mappings
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/api/fir-distance-mappings/?is_active=false"
  params:
    - name: is_active
      value: "false"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

