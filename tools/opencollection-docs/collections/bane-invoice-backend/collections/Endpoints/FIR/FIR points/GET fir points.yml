info:
  name: GET fir points
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/api/fir-point/?page=1&limit=10&is_active=true"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: is_active
      value: "true"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: GET fir points
    request:
      url: "{{url}}/api/fir-point/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.27.5
        - name: date
          value: Sun, 07 Jun 2026 06:25:55 GMT
        - name: content-type
          value: application/json
        - name: content-length
          value: "165"
        - name: connection
          value: keep-alive
        - name: vary
          value: Accept, origin
        - name: allow
          value: GET, POST, HEAD, OPTIONS
        - name: x-frame-options
          value: DENY, SAMEORIGIN
        - name: x-content-type-options
          value: nosniff, nosniff
        - name: referrer-policy
          value: same-origin, no-referrer-when-downgrade
        - name: cross-origin-opener-policy
          value: same-origin
        - name: x-xss-protection
          value: 1; mode=block
      body:
        type: json
        data: |-
          {
            "status": "success",
            "message": "FIR Point Successfully Fetched",
            "data": {
              "result": [
                {
                  "id": 1,
                  "name": "firstpoint",
                  "latitude": 2.856,
                  "longitude": -3.45,
                  "is_active": false
                }
              ]
            }
          }
  - name: get paginated fir points
    request:
      url: "{{url}}/api/fir-point/?page=1&limit=10"
      method: GET
      params:
        - name: page
          value: "1"
          type: query
        - name: limit
          value: "10"
          type: query
