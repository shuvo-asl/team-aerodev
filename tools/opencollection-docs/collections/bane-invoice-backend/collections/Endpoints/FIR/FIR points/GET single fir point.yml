info:
  name: GET single fir point
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/api/fir-point/1"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: get single fir point
    request:
      url: "{{url}}/api/fir-point/1"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.27.5
        - name: date
          value: Sun, 07 Jun 2026 06:29:10 GMT
        - name: content-type
          value: application/json
        - name: content-length
          value: "163"
        - name: connection
          value: keep-alive
        - name: vary
          value: Accept, origin
        - name: allow
          value: GET, PUT, PATCH, DELETE, HEAD, OPTIONS
        - name: x-frame-options
          value: DENY, SAMEORIGIN
        - name: x-content-type-options
          value: nosniff, nosniff
        - name: referrer-policy
          value: same-origin, no-referrer-when-downgrade
        - name: cross-origin-opener-policy
          value: same-origin
        - name: x-xss-protection
          value: 1; mode=block
      body:
        type: json
        data: |-
          {
            "status": "success",
            "message": "FIR Point Fetched Successfully",
            "data": {
              "result": {
                "id": 1,
                "name": "firstpoint",
                "latitude": 2.856,
                "longitude": -3.45,
                "is_active": false
              }
            }
          }
