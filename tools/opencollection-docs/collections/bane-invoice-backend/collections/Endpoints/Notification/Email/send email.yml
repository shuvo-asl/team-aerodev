info:
  name: send email
  type: http
  seq: 5

http:
  method: POST
  url: "{{url}}/api/send_email/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
          "users": [
              1,2,3
          ],
          "mail_subject": "Confirm Amit Malakar For the position of Junior Software Developer",
          "text": "Dear Ishtiak vai.please confirm amit malakar."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: send email
    request:
      url: "{{url}}/api/send_email/"
      method: POST
      headers:
        - name: Authorization
          value: Bearer {{token}}
      body:
        type: json
        data: |-
          {
              "users": [
                  1,2,3
              ],
              "mail_subject": "test",
              "text": "test"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, origin
        - name: Allow
          value: POST, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "16"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
        - name: Cross-Origin-Opener-Policy
          value: same-origin
        - name: Server
          value: daphne
      body:
        type: json
        data: |-
          {
              "success": true
          }
