info:
  name: create schedule email
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/api/email_schedule/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
          "receiver": [
              1,2,3
          ],
          "schedule_month": "*",
          "schedule_day": "*",
          "schedule_hour": "*",
          "schedule_minute": "*",
          "mail_subject": "test",
          "text": "test sms"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: create schedule email
    request:
      url: "{{url}}/api/email_schedule/"
      method: POST
      headers:
        - name: Authorization
          value: Bearer {{token}}
      body:
        type: json
        data: |-
          {
              "receiver": [
                  1,2,3
              ],
              "schedule_month": "*",
              "schedule_day": "*",
              "schedule_hour": "*",
              "schedule_minute": "*",
              "mail_subject": "test",
              "text": "test sms"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, origin
        - name: Allow
          value: GET, POST, HEAD, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "207"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
        - name: Cross-Origin-Opener-Policy
          value: same-origin
        - name: Server
          value: daphne
      body:
        type: json
        data: |-
          {
              "success": true,
              "data": {
                  "id": 1,
                  "schedule_month": "*",
                  "schedule_day": "*",
                  "schedule_hour": "*",
                  "schedule_minute": "*",
                  "mail_subject": "test",
                  "text": "test sms",
                  "send_to_all": false,
                  "active": true,
                  "receiver": [
                      1,
                      2,
                      3
                  ]
              }
          }
