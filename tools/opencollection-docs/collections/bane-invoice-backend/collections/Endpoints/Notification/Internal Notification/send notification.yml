info:
  name: send notification
  type: http
  seq: 7

http:
  method: POST
  url: "{{url}}/api/send_notification/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
          "subscription": 3,
          "message": "test 9"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: send notification success
    request:
      url: "{{url}}/api/send_notification/"
      method: POST
      headers:
        - name: Authorization
          value: Bearer {{token}}
      body:
        type: json
        data: |-
          {
              "subscription": 1,
              "message": "test 9"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, origin
        - name: Allow
          value: POST, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "16"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
        - name: Cross-Origin-Opener-Policy
          value: same-origin
        - name: Server
          value: daphne
      body:
        type: json
        data: |-
          {
              "success": true
          }
  - name: send notification failed
    request:
      url: "{{url}}/api/send_notification/"
      method: POST
      headers:
        - name: Authorization
          value: Bearer {{token}}
      body:
        type: json
        data: |-
          {
              "subscription": 3,
              "message": "test 9"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, origin
        - name: Allow
          value: POST, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "86"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
        - name: Cross-Origin-Opener-Policy
          value: same-origin
        - name: Server
          value: daphne
      body:
        type: json
        data: |-
          {
              "success": false,
              "data": {
                  "msg": "NotificationSubsribe matching query does not exist."
              }
          }
