info:
  name: get User notification read
  type: http
  seq: 3

http:
  method: GET
  url: "{{url}}/api/user_notification_read"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: multipart-form
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: get User notification read
    request:
      url: "{{url}}/api/user_notification_read"
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{token}}
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, origin
        - name: Allow
          value: GET, PUT, HEAD, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "64"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
        - name: Cross-Origin-Opener-Policy
          value: same-origin
        - name: Server
          value: daphne
      body:
        type: json
        data: |-
          {
              "success": true,
              "data": {
                  "id": 1,
                  "total_notification": 1,
                  "user": 1
              }
          }
