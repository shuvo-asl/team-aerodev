info:
  name: get notifications of subscriptions
  type: http
  seq: 4

http:
  method: GET
  url: "{{url}}/api/subscription_notifications?subscription=3"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  params:
    - name: subscription
      value: "3"
      type: query
  body:
    type: multipart-form
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: get notifications of subscriptions success
    request:
      url: "{{url}}/api/subscription_notifications?subscription=2"
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{token}}
      params:
        - name: subscription
          value: "2"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: GET, HEAD, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "352"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
        - name: Cross-Origin-Opener-Policy
          value: same-origin
        - name: Server
          value: daphne
      body:
        type: json
        data: |-
          {
              "success": true,
              "data": [
                  {
                      "id": 15,
                      "notification_type": "create",
                      "message": "test created",
                      "broadcast_month": "*",
                      "broadcast_day": "*",
                      "broadcast_hour": "*",
                      "broadcast_minute": "*",
                      "is_onetime": false,
                      "active": false,
                      "created_at": "2023-03-27T11:00:54.250701+06:00",
                      "updated_at": "2023-03-27T11:00:54.250711+06:00",
                      "subscription": 2,
                      "created_by": 1,
                      "updated_by": 1
                  }
              ]
          }
  - name: get notifications of subscriptions failed
    request:
      url: "{{url}}/api/subscription_notifications?subscription=3"
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{token}}
      params:
        - name: subscription
          value: "3"
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, origin
        - name: Allow
          value: GET, HEAD, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "86"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
        - name: Cross-Origin-Opener-Policy
          value: same-origin
        - name: Server
          value: daphne
      body:
        type: json
        data: |-
          {
              "success": false,
              "data": {
                  "msg": "NotificationSubsribe matching query does not exist."
              }
          }
