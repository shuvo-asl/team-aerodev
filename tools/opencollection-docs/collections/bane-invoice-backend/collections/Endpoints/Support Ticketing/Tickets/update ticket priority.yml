info:
  name: update ticket priority
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{url}}/api/update-ticket-priority/TCK-00014/"
  body:
    type: json
    data: |-
      {
          "priority": "critical"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: update ticket priority
    request:
      url: "{{url}}/api/update-ticket-priority/TCK-00014/"
      method: PATCH
      body:
        type: json
        data: |-
          {
              "priority": "critical"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.27.5
        - name: Date
          value: Thu, 15 May 2025 05:40:07 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "113"
        - name: Connection
          value: keep-alive
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: PATCH, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Ticket's Priority successfully updated",
              "data": {
                  "result": {
                      "priority": "critical"
                  }
              }
          }
