info:
  name: assign user to ticket
  type: http
  seq: 4

http:
  method: POST
  url: "{{url}}/api/assign-user-to-ticket/"
  body:
    type: json
    data: |-
      {
          "ticket_id": "TCK-00014",
          "user_id": 1
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: assign user to ticket
    request:
      url: "{{url}}/api/assign-user-to-ticket/"
      method: POST
      body:
        type: json
        data: |-
          {
              "ticket_id": "TCK-00014",
              "user_id": 1
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.27.5
        - name: Date
          value: Thu, 15 May 2025 05:44:44 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "82"
        - name: Connection
          value: keep-alive
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: POST, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Ticket assigned successfully",
              "data": {
                  "result": {}
              }
          }
