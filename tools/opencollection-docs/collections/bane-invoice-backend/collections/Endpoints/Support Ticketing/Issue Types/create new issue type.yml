info:
  name: create new issue type
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/api/issue-types/"
  body:
    type: json
    data: |-
      {
          "name": "Slow UI901",
          "handlers": [1, 3]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: create new issue type, type alread exists
    request:
      url: "{{url}}/api/issue-types/"
      method: POST
      body:
        type: json
        data: |-
          {
              "name": "Slow UI",
              "handlers": [1, 3]
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Server
          value: nginx/1.27.5
        - name: Date
          value: Thu, 08 May 2025 06:14:49 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "134"
        - name: Connection
          value: keep-alive
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: GET, POST, HEAD, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "failed",
              "message": "Issue Type Failed To Create",
              "error": null,
              "errors": {
                  "name": "issue type with this name already exists."
              }
          }
  - name: create new issue type
    request:
      url: "{{url}}/api/issue-types/"
      method: POST
      body:
        type: json
        data: |-
          {
              "name": "Slow UI901",
              "handlers": [1, 3]
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Server
          value: nginx/1.27.5
        - name: Date
          value: Thu, 08 May 2025 06:20:39 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "184"
        - name: Connection
          value: keep-alive
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: GET, POST, HEAD, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Issue Type successfully created",
              "data": {
                  "result": {
                      "id": 10,
                      "name": "Slow UI901",
                      "handlers": [
                          {
                              "id": 3,
                              "name": "Jeff Bezos"
                          },
                          {
                              "id": 1,
                              "name": "Admin Admin"
                          }
                      ]
                  }
              }
          }

docs: |-
  **Description:**

  Creates a new issue type with a **unique name**. You may optionally assign handler users.

  **Request Body:**

  ``` json
  {
    "name": "Slow UI901",
    "handlers": [1, 3]  // Optional
  }

   ```

  **Field Details:**

  - `name` _(string, required)_ – Must be unique across all issue types.
      
  - `handlers` _(list of user IDs, optional)_ – Users assigned to handle this issue type.
      

  **Success Response:**

  ``` json
  {
    "status": "success",
    "message": "Issue Type successfully created",
    "data": {
      "result": {
        "id": 10,
        "name": "Slow UI901",
        "handlers": [
          { "id": 3, "name": "Jeff Bezos" },
          { "id": 1, "name": "Admin Admin" }
        ]
      }
    }
  }

   ```

  ``` json
  Failure Response (Duplicate Name):
  {
  "status": "failed",
  "message": "Issue Type Failed To Create",
  "error": null,
  "errors": {
  "name": "issue type with this name already exists."
  }
  }
   ```
