info:
  name: issue type list
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/api/issue-types/"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: New Request
    request:
      url: "{{url}}/api/issue-types/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.27.5
        - name: Date
          value: Wed, 07 May 2025 09:05:15 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "183"
        - name: Connection
          value: keep-alive
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: GET, POST, HEAD, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Issue Type Successfully Fetched",
              "data": {
                  "result": [
                      {
                          "id": 1,
                          "name": "Payment"
                      },
                      {
                          "id": 2,
                          "name": "Currency Issue"
                      },
                      {
                          "id": 3,
                          "name": "Need Human Assistance"
                      }
                  ]
              }
          }
