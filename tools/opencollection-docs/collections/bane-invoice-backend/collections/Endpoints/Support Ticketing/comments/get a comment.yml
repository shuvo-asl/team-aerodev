info:
  name: get a comment
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/api/comments/12/"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: get a comment
    request:
      url: "{{url}}/api/comments/12/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.27.5
        - name: Date
          value: Thu, 08 May 2025 09:24:57 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "276"
        - name: Connection
          value: keep-alive
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: GET
        - name: X-Frame-Options
          value: DENY
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Comment Fetched Successfully",
              "data": {
                  "result": {
                      "ticket": 14,
                      "text": "example text",
                      "id": 12,
                      "created_at": "2025-05-08T13:28:52.282128+06:00",
                      "attachments": [
                          {
                              "id": 23,
                              "file": "http://localhost:5011/api/media/ticket_attachments/bdflag_leeHYpC.jpg"
                          }
                      ]
                  }
              }
          }
