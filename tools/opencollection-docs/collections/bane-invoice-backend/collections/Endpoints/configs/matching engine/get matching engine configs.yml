info:
  name: get matching engine configs
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/api/matching-engine-configs/?page=1&limit=3"
  headers:
    - name: page
      value: "1"
      disabled: true
    - name: limit
      value: "10"
      disabled: true
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "3"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: get configs without pagination
    request:
      url: "{{url}}/api/matching-engine-configs/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
