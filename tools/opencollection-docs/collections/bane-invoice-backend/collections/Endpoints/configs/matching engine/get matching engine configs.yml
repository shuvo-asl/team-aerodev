        - name: vary
          value: Accept, origin
        - name: allow
          value: GET, POST, HEAD, OPTIONS
        - name: x-frame-options
          value: DENY, SAMEORIGIN
        - name: x-content-type-options
          value: nosniff, nosniff
        - name: referrer-policy
