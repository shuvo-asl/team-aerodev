info:
  name: Update Flights State
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/api/test-update-flight-state/"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Slack
    request:
      url: "{{url}}/api/test/slack/"
      method: POST
      headers:
        - name: Authorization
          value: Bearer {{token}}
      body:
        type: json
        data: |-
          {
              "log_level": "ERROR",
              "log": "Test log yfgruifgh"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Wed, 28 Aug 2024 05:46:43 GMT
        - name: Server
          value: WSGIServer/0.2 CPython/3.7.17
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: POST, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "113"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Sent to slack",
              "data": {
                  "result": {
                      "log_level": "ERROR",
                      "log": "Test log yfgruifgh"
                  }
              }
          }
