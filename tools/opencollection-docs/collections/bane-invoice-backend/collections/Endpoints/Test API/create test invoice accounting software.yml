info:
  name: create test invoice accounting software
  type: http
  seq: 3

http:
  method: POST
  url: "{{url}}/api/create-test-invoice/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
          "account": "xero",
          "data": {
              "invoice_no": "INV000001"
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
