info:
  name: create bank details
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/api/system-settings/"
  body:
    type: json
    data: |-
      {
          "bank_details": "example Bank deatils",
          "type": "bank_details",
          "title": "imp bank info"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

