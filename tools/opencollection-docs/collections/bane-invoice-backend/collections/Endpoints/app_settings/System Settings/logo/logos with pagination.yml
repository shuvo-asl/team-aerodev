http:
  method: GET
  url: "{{url}}/api/system-settings/?type=logo&page=1&limit=3"
  params:
    - name: type
      value: logo
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "3"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
