info:
  name: get schedules
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/api/operator-performance-summary-schedule"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: list of schedules
    request:
      url: "{{url}}/api/operator-performance-summary-schedule"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.27.5
        - name: date
          value: Thu, 02 Jul 2026 05:59:59 GMT
        - name: content-type
          value: application/json
        - name: content-length
          value: "367"
        - name: connection
          value: keep-alive
        - name: vary
          value: Accept, origin
        - name: allow
          value: GET, POST, HEAD, OPTIONS
        - name: x-frame-options
          value: DENY, SAMEORIGIN
        - name: x-content-type-options
          value: nosniff, nosniff
        - name: referrer-policy
          value: same-origin, no-referrer-when-downgrade
        - name: cross-origin-opener-policy
          value: same-origin
        - name: x-xss-protection
          value: 1; mode=block
      body:
        type: json
        data: |-
          {
            "status": "success",
            "message": "Operator Performance Summary Schedule Successfully Fetched",
            "data": {
              "result": [
                {
                  "id": 4,
                  "title": "test schedule",
                  "to": [
                    "kamrul@asl.aero"
                  ],
                  "cc": [
                    "afroza@asl.aero",
                    "titas@asl.aero"
                  ],
                  "bcc": [],
                  "time": "13:09:00",
                  "previous_month": true,
                  "start_day": null,
                  "end_day": null,
                  "sent_day": 20,
                  "created_at": "2026-07-02T05:59:03.476316Z",
                  "updated_at": null
                }
              ]
            }
          }
