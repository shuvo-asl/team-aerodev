info:
  name: switch company
  type: http
  seq: 3

http:
  method: GET
  url: "{{url}}/api/switch-company/2"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: company switch fails when membership is inactive
    request:
      url: "{{url}}/api/switch-company/2"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Date
          value: Tue, 03 Dec 2024 05:45:55 GMT
        - name: Server
          value: WSGIServer/0.2 CPython/3.7.17
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: GET, HEAD, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "129"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "failed",
              "message": "Failed to switch company",
              "error": "You are temporally deactivated from this company",
              "errors": null
          }
