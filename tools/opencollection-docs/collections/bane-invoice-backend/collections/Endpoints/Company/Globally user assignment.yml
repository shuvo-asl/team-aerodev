info:
  name: Globally user assignment
  type: http
  seq: 8

http:
  method: POST
  url: "{{url}}/api/assign-to-companies/"
  body:
    type: json
    data: |-
      {
          "user": 33,
          "active_company": 1,
          "companies": [2,3]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
