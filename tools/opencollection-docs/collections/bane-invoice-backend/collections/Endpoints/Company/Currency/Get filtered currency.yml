info:
  name: Get filtered currency
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/api/currency?search=usd"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  params:
    - name: search
      value: usd
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Get filtered currency
    request:
      url: "{{url}}/api/currency?search=usd"
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{token}}
      params:
        - name: search
          value: usd
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.27.4
        - name: Date
          value: Tue, 18 Mar 2025 05:54:14 GMT
        - name: Content-Type
          value: application/json
        - name: Transfer-Encoding
          value: chunked
        - name: Connection
          value: keep-alive
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: GET, POST, HEAD, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
        - name: Content-Encoding
          value: gzip
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Currency Successfully Fetched",
              "data": {
                  "result": [
                      {
                          "current_rate": 0.008231,
                          "name": "United States Dollar",
                          "prefix": "$",
                          "short_key": "USD",
                          "flag": "data:image/png;base64,",
                          "id": 2,
                          "is_default": false
                      }
                  ]
              }
          }
