info:
  name: Get All Currency
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/api/currency/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

