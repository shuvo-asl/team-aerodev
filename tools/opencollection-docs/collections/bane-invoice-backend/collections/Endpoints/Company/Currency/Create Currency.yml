info:
  name: Create Currency
  type: http
  seq: 3

http:
  method: POST
  url: "{{url}}/api/currency/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
          "currency": 3,
          "is_default": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Create Currency
    request:
      url: "{{url}}/api/currency/"
      method: POST
      headers:
        - name: Authorization
          value: Bearer {{token}}
      body:
        type: json
        data: |-
          {
              "currency": 3,
              "is_default": true
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Date
          value: Thu, 02 Jan 2025 05:14:36 GMT
        - name: Server
          value: WSGIServer/0.2 CPython/3.7.17
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: GET, POST, HEAD, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "180"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Currency successfully created",
              "data": {
                  "result": {
                      "current_rate": 85.7098,
                      "name": "Rupee",
                      "prefix": "₹",
                      "short_key": "INR",
                      "id": 42,
                      "is_default": false
                  }
              }
          }
