info:
  name: Get active currency
  type: http
  seq: 6

http:
  method: GET
  url: "{{url}}/api/current-currency/"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Get active currency
    request:
      url: "{{url}}/api/current-currency/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Wed, 18 Sep 2024 08:48:32 GMT
        - name: Server
          value: WSGIServer/0.2 CPython/3.7.17
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: GET, HEAD, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "161"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Active Currency Fetched Successfully",
              "data": {
                  "result": {
                      "id": 1,
                      "prefix": "$",
                      "short_key": "BDT",
                      "current_rate": 1,
                      "default": true
                  }
              }
          }
