info:
  name: update exchange rate
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{url}}/api/update-exchange-rate/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: update exchange rate
    request:
      url: "{{url}}/api/update-exchange-rate/"
      method: PATCH
      headers:
        - name: Authorization
          value: Bearer {{token}}
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Tue, 12 Nov 2024 10:18:50 GMT
        - name: Server
          value: WSGIServer/0.2 CPython/3.7.17
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: PATCH, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "86"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Exchange rate is being updated..",
              "data": {
                  "result": {}
              }
          }
