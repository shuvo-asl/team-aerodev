info:
  name: Update Currency
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{url}}/api/currency/2/"
  body:
    type: json
    data: |-
      {
          "current_rate": "5"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Update Currency
    request:
      url: "{{url}}/api/currency/2/"
      method: PATCH
      body:
        type: json
        data: |-
          {
              "current_rate": "5"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Sun, 01 Sep 2024 17:06:01 GMT
        - name: Server
          value: WSGIServer/0.2 CPython/3.7.17
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: GET, PUT, PATCH, DELETE, HEAD, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "154"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Currency successfully updated",
              "data": {
                  "result": {
                      "id": 2,
                      "prefix": "$",
                      "short_key": "BDT",
                      "current_rate": 5,
                      "default": null
                  }
              }
          }
