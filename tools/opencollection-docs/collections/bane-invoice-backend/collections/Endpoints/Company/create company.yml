info:
  name: create company
  type: http
  seq: 5

http:
  method: POST
  url: "{{url}}/api/companies/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
          "name": "Bd_company",
          "country": "Bangladesh",
          "company_currency_id": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: create company
    request:
      url: "{{url}}/api/companies/"
      method: POST
      headers:
        - name: Authorization
          value: Bearer {{token}}
      body:
        type: json
        data: |-
          {
              "name": "Bd_company",
              "country": "Bangladesh"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Date
          value: Tue, 10 Dec 2024 05:26:23 GMT
        - name: Server
          value: WSGIServer/0.2 CPython/3.8.20
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: GET, POST, HEAD, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "150"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Company successfully created",
              "data": {
                  "result": {
                      "id": 3,
                      "name": "Bd_company",
                      "country": "Bangladesh",
                      "is_primary": false
                  }
              }
          }
