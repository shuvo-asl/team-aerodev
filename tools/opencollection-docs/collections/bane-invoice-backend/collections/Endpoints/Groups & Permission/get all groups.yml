info:
  name: get all groups
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/api/groups?limit=5"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  params:
    - name: limit
      value: "5"
      type: query
  body:
    type: multipart-form
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

