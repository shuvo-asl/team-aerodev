info:
  name: notification count
  type: http
  seq: 3

http:
  method: GET
  url: "{{url}}/api/in-app-notifications/notification-count/"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: notification count
    request:
      url: "{{url}}/api/in-app-notifications/notification-count/"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Server
          value: nginx/1.27.5
        - name: Date
          value: Tue, 13 May 2025 07:57:19 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "115"
        - name: Connection
          value: keep-alive
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: GET
        - name: X-Frame-Options
          value: DENY
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Successfully fetched Notification Count",
              "data": {
                  "result": {
                      "notification_count": 1
                  }
              }
          }
