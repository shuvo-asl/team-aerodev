http:
  method: GET
  url: "{{url}}/api/in-app-notifications?is_read=false"
  params:
    - name: is_read
      value: "false"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

