info:
  name: Create User
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/api/users/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: multipart-form
    data:
      - name: username
        type: text
        value: new_user
      - name: first_name
        type: text
        value: first_name
      - name: last_name
        type: text
        value: last_name
      - name: user_type
        type: text
        value: caab
      - name: email
        type: text
        value: u667688@gmail.com
      - name: profile_image
        type: file
        value:
          - /home/devs/Music/images.png
      - name: password
        type: text
        value: testpassword
      - name: companies
        type: text
        value: "1"
      - name: companies
        type: text
        value: "2"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

