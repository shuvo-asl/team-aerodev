info:
  name: Current User Profile Update
  type: http
  seq: 9

http:
  method: PATCH
  url: "{{url}}/api/update_profile/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: multipart-form
    data:
      - name: profile_image
        type: file
        value:
          - /home/devs/images.jpeg
      - name: first_name
        type: text
        value: Admin
      - name: phone
        type: text
        value: "+8801684806728"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
