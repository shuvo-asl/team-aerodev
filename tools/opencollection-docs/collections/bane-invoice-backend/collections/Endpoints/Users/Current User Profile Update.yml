    request:
      url: "{{url}}/api/update_profile/"
      method: PATCH
      headers:
        - name: Authorization
          value: Bearer {{token}}
      body:
        type: multipart-form
        data:
          - name: profile_image
            type: file
            value:
              - /home/devs/images.jpeg
