info:
  name: Current User Password Change
  type: http
  seq: 10

http:
  method: PUT
  url: "{{url}}/api/change_password/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: multipart-form
    data:
      - name: old_password
        type: text
        value: admin
      - name: new_password
        type: text
        value: admin
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Current User Password Change
    request:
      url: "{{url}}/api/change_password/"
      method: PUT
      headers:
        - name: Authorization
          value: Bearer {{token}}
      body:
        type: multipart-form
        data:
          - name: old_password
            type: text
            value: admin
          - name: new_password
            type: text
            value: admin
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Tue, 12 Nov 2024 10:35:02 GMT
        - name: Server
          value: WSGIServer/0.2 CPython/3.7.17
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: PUT, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "85"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "'Password' Successfully Changed",
              "data": {
                  "result": []
              }
          }
