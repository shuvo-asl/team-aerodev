info:
  name: Get All Users
  type: http
  seq: 3

http:
  method: GET
  url: "{{url}}/api/users/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  params:
    - name: limit
      value: "5"
      type: query
      disabled: true
    - name: page
      value: "2"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Get All Users with pagination
    request:
      url: "{{url}}/api/users/?limit=5&page=2"
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{token}}
      params:
        - name: limit
          value: "5"
          type: query
        - name: page
          value: "2"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
