info:
  name: User's Password Change
  type: http
  seq: 11

http:
  method: POST
  url: "{{url}}/api/change_users_password/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: multipart-form
    data:
      - name: new_password
        type: text
        value: admin123456
      - name: confirm_password
        type: text
        value: admin123456
      - name: user_id
        type: text
        value: "8"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: User's Password Change
    request:
      url: "{{url}}/api/change_users_password/"
      method: POST
      headers:
        - name: Authorization
          value: Bearer {{token}}
      body:
        type: multipart-form
        data:
          - name: new_password
            type: text
            value: admin123456
          - name: confirm_password
            type: text
            value: admin123456
          - name: user_id
            type: text
            value: "8"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Tue, 12 Nov 2024 10:36:50 GMT
        - name: Server
          value: WSGIServer/0.2 CPython/3.7.17
        - name: Content-Type
          value: application/json
        - name: Vary
          value: Accept, Origin
        - name: Allow
          value: POST, OPTIONS
        - name: X-Frame-Options
          value: DENY
        - name: Content-Length
          value: "92"
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: same-origin
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "'User's Password' Successfully Changed",
              "data": {
                  "result": []
              }
          }
